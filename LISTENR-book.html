<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listenr · Book</title>
<meta name="description" content="UI prototype: choose a listener, a date and a time.">
<link rel="icon" type="image/png" sizes="32x32" href="images/listenr/favicon-32.png">
<link rel="apple-touch-icon" href="images/listenr/apple-touch-icon.png">
<link rel="manifest" href="listenr.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Listenr">
<meta property="og:title" content="Listenr">
<meta property="og:description" content="Someone to listen. When you need it. A safe, judgment-free space to feel a little lighter.">
<meta property="og:url" content="https://dedrox2k.github.io/dedrox/LISTENR-book.html">
<meta property="og:image" content="https://dedrox2k.github.io/dedrox/images/listenr/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Listenr logo on a soft dusk sky: Someone to listen. When you need it.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dedrox2k.github.io/dedrox/images/listenr/og-card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  :root {
    --page: #eceff4;
    --paper: #ffffff;
    --card: #f1f3f7;
    --sea: #3a86b0;
    --sea-deep: #2a6f96;
    --sea-soft: #d9e8f3;
    --ink: #1c2431;
    --ink-soft: #636c7b;
    --ink-faint: #c0c6d0;
    --line: #e2e6ee;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --ease-soft: cubic-bezier(.45, 0, .2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }

  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: vt-out .6s cubic-bezier(.45, 0, .2, 1) both; }
  ::view-transition-new(root) { animation: vt-in .9s cubic-bezier(.16, 1, .3, 1) both; }
  @keyframes vt-out { to { opacity: 0; filter: blur(6px); transform: scale(.985); } }
  @keyframes vt-in { from { opacity: 0; filter: blur(6px); transform: translateY(18px); } }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  /* No focus box on tap or click; a soft ring only when navigating by keyboard (html.kbd) */
  :focus { outline: none; }
  html.kbd :focus-visible { outline: 2px solid #c4607f; outline-offset: 3px; }
  .serif { font-family: "Lora", Georgia, serif; }

  .frame {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100svh;
    background: var(--paper);
    overflow: hidden;
    padding: 0 16px calc(120px + env(safe-area-inset-bottom)); /* clears the call summary */
  }
  @media (min-width: 560px) {
    body { padding-top: 64px; }
    .frame { border-radius: 56px 56px 0 0; }
  }

  /* Orange breath at the top edge */
  .glow {
    position: absolute;
    left: -8%; right: -8%; top: -46px;
    height: 84px;
    border-radius: 50%;
    background: #f0a9c0;
    filter: blur(26px);
    opacity: .85;
    animation: glow 7s var(--ease-soft) infinite alternate;
    pointer-events: none;
  }
  @keyframes glow { to { opacity: .55; transform: scaleX(.92); } }

  /* Load-in */
  .intro {
    opacity: 0;
    transform: translate3d(0, 22px, 0);
    filter: blur(8px);
    animation: rise 1.5s var(--ease) forwards;
    animation-delay: calc(var(--d, 0) * 110ms + 120ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }

  .topbar { position: relative; display: flex; align-items: center; padding-top: 44px; }
  .back {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card);
    transition: transform .9s var(--ease), background .9s var(--ease);
  }
  .back:hover { background: var(--sea-soft); }
  .back:active { transform: scale(.94); transition-duration: .25s; }

  .head { padding: 28px 8px 8px; }
  .head h1 { font-size: 36px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
  .head p { margin-top: 10px; font-size: 16px; color: #2e3644; }

  .card {
    margin-top: 20px;
    border-radius: 28px;
    background: var(--card);
    padding: 22px 20px;
  }

  /* ---------- Listeners ---------- */
  .selected-line { font-size: 15px; color: var(--ink-soft); }
  .selected-line .roll { color: var(--ink); font-weight: 700; }
  .avatars {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
    gap: 12px 8px;
    justify-items: center;
  }
  /* Rounded squares, so they stay soft and read differently from the calendar's circles */
  .av {
    position: relative;
    width: 50px; height: 50px;
    border-radius: 16px;
    display: grid; place-items: center;
    font-size: 15px;
    font-weight: 500;
    color: #6b7382;
    background: #d8dce4;
    opacity: .75;
    transition: opacity 1s var(--ease), transform 1s var(--ease), color 1s var(--ease);
  }
  .av::after {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 20px;
    border: 2px solid var(--sea);
    opacity: 0;
    transform: scale(.85);
    transition: opacity .8s var(--ease), transform 1s var(--ease);
  }
  @media (hover: hover) { .av:hover { opacity: 1; } }
  .av[aria-pressed="true"] { opacity: 1; color: var(--ink); }
  .av[aria-pressed="true"]::after { opacity: 1; transform: scale(1); }
  .av:active { transform: scale(.95); transition-duration: .25s; }
  .listener-meta { margin-top: 18px; font-size: 14px; color: var(--ink-soft); display: flex; gap: 6px; flex-wrap: wrap; }
  .listener-meta .roll { color: var(--ink); }

  /* ---------- Roll text: values swap with a soft vertical blur ---------- */
  .roll { display: inline-grid; overflow: hidden; vertical-align: bottom; white-space: nowrap; }
  .roll > span { grid-area: 1 / 1; }

  /* ---------- Calendar ---------- */
  .month-nav { margin-top: 36px; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .month-nav button, .month-label {
    height: 46px;
    border-radius: 16px;
    background: var(--card);
    display: grid; place-items: center;
  }
  .month-nav button { width: 46px; transition: background .8s var(--ease), transform .8s var(--ease); }
  .month-nav button:hover { background: var(--sea-soft); }
  .month-nav button:active { transform: scale(.94); transition-duration: .25s; }
  .month-label { min-width: 200px; padding: 0 22px; border-radius: 999px; font-size: 19px; }
  .cal { margin-top: 10px; padding: 18px 12px 14px; }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  .weekdays { font-size: 16px; padding-bottom: 10px; margin: 0 6px 6px; border-bottom: 1.5px solid var(--line); }
  .days-wrap { position: relative; }
  .day {
    position: relative; z-index: 1;
    height: 52px;
    display: grid; place-items: center;
    font-size: 17px;
    color: var(--ink-faint);
    cursor: default;
    transition: color .8s var(--ease);
  }
  .day::before {
    content: "";
    position: absolute;
    width: 42px; height: 42px; border-radius: 50%;
    left: 50%; top: 50%;
    background: var(--sea-soft);
    transform: translate(-50%, -50%) scale(.4);
    opacity: 0;
    z-index: -1;
    transition: opacity .9s var(--ease), transform 1s var(--ease);
  }
  .day.avail { color: var(--ink); cursor: pointer; }
  .day.avail::before { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .day.avail:hover::before { transform: translate(-50%, -50%) scale(1.08); }
  .day.sel { color: #fff; font-weight: 700; }
  .day.sel::before { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
  .day.today { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
  .puck {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--sea);

    transition: transform .9s var(--ease), opacity .6s var(--ease-soft);
    will-change: transform;
  }
  .puck.hidden { opacity: 0; }
  .puck.instant { transition: none; }
  .cal-empty { text-align: center; font-size: 14px; color: var(--ink-soft); padding-top: 8px; min-height: 30px; transition: opacity .6s var(--ease-soft); }

  /* ---------- Time ---------- */
  .time { margin-top: 36px; padding: 14px 14px 18px; }
  .time-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .time-pill {
    height: 46px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--paper);
    display: flex; align-items: center;
    font-size: 17px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: color .6s var(--ease-soft), opacity .6s var(--ease-soft);
  }
  .time-pill.muted { color: var(--ink-faint); }
  .seg {
    position: relative;
    display: flex;
    padding: 4px;
    border-radius: 999px;
    background: #e6e8ee;
  }
  .seg button {
    position: relative; z-index: 1;
    width: 54px; height: 38px;
    display: grid; place-items: center;
    color: var(--ink-soft);
    transition: color .8s var(--ease);
  }
  .seg button[aria-pressed="true"] { color: var(--ink); }
  .seg .thumb {
    position: absolute; top: 4px; left: 4px;
    width: 54px; height: 38px; border-radius: 999px;
    background: var(--paper);

    transition: transform .9s var(--ease);
  }
  .seg[data-mode="list"] .thumb { transform: translateX(54px); }

  .views { position: relative; height: 232px; margin-top: 6px; }
  .view { position: absolute; inset: 0; transition: opacity .8s var(--ease-soft), transform 1s var(--ease), filter .8s var(--ease-soft); }
  .view.off { opacity: 0; pointer-events: none; filter: blur(6px); }
  .arc.off { transform: translateY(10px) scale(.98); }
  .list.off { transform: translateY(-10px); }

  .arc {
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    outline: none;
  }
  .arc.dragging { cursor: grabbing; }
  .arc svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .arc .lbl {
    position: absolute; left: 0; top: 0;
    width: 48px; margin-left: -24px;
    text-align: center;
    font-size: 26px;
    line-height: 1;
    will-change: transform, opacity;
    transition: color .8s var(--ease), font-weight .8s;
    color: var(--ink-faint);
  }
  .arc .lbl.on { color: var(--ink); font-weight: 700; }
  .arc .lbl small { display: block; font-size: 11px; margin-top: 3px; letter-spacing: .04em; font-weight: 400; color: var(--ink-soft); opacity: .8; }
  .arc:focus-visible .window { stroke: var(--sea); }
  .hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 13px; color: var(--ink-soft); pointer-events: none; transition: opacity .8s var(--ease-soft); }

  .list { overflow-y: auto; padding: 10px 2px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start; overscroll-behavior: contain; }
  .slot {
    height: 46px;
    border-radius: 999px;
    background: var(--paper);
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    transition: background .8s var(--ease), color .8s var(--ease), transform .8s var(--ease);
  }
  .slot:hover { background: var(--sea-soft); }
  .slot[aria-pressed="true"] { background: var(--sea); color: #fff; font-weight: 700; }
  .slot:active { transform: scale(.95); transition-duration: .25s; }
  .list-empty { grid-column: 1 / -1; text-align: center; color: var(--ink-soft); padding-top: 70px; font-size: 15px; }

  /* ---------- Call summary: attached to the bottom edge, always in view ---------- */
  .summary {
    position: fixed; z-index: 30;
    left: 50%; bottom: 0;
    width: min(100%, 480px);
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-radius: 24px 24px 0 0;
    background: #fff;
    box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(25, 40, 60, .06);
    transform: translateX(-50%);
    animation: summary-in 1.2s var(--ease) .5s both;
  }
  @keyframes summary-in { from { transform: translate(-50%, 100%); } }
  .mini {
    flex: none;
    width: 42px; height: 42px; border-radius: 13px;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 500;
    color: #6b7382; background: #d8dce4;
  }
  .sum-txt { flex: 1; min-width: 0; line-height: 1.3; }
  .sum-name { display: block; font-size: 15px; font-weight: 700; }
  .sum-rel { display: block; font-size: 13px; color: var(--sea-deep); font-weight: 500; }
  .sum-when { display: block; font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum-when b { color: var(--ink); font-weight: 500; }
  .cta {
    flex: none;
    height: 40px;
    padding: 0 16px;
    border-radius: 999px;
    background: var(--sea);
    color: #fff;
    font-size: 14px; font-weight: 700;
    display: grid; place-items: center;
    transition: transform .9s var(--ease), background .9s var(--ease);
  }
  .cta:active { transform: scale(.96); transition-duration: .2s; }
  .cta.done { background: var(--pink-deep, #c4607f); }

  /* ---------- Booked: a soft dusk screen that settles in over the booking ---------- */
  .booked {
    position: fixed; inset: 0; z-index: 50;
    display: flex; justify-content: center;
    overflow-y: auto;
    color: #fff;
    background:
      radial-gradient(90% 55% at 85% 5%, rgba(255, 228, 238, .8) 0%, rgba(255,228,238,0) 70%),
      linear-gradient(170deg, #f6cdd9 0%, #9dbbdb 40%, #5f9cc2 75%, #3f86ad 100%);
    opacity: 0;
    filter: blur(10px);
    transition: opacity .9s var(--ease-soft), filter 1.1s var(--ease-soft);
  }
  .booked.show { opacity: 1; filter: blur(0); }
  .booked[hidden] { display: none; }
  .bk-inner { width: min(100%, 480px); padding: calc(72px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom)); text-align: center; }
  .bk-inner > * { opacity: 0; transform: translateY(16px); transition: opacity 1s var(--ease-soft), transform 1.4s var(--ease); }
  .booked.show .bk-inner > * { opacity: 1; transform: none; }
  .booked.show .bk-inner > :nth-child(2) { transition-delay: .35s; }
  .booked.show .bk-inner > :nth-child(3) { transition-delay: .45s; }
  .booked.show .bk-inner > :nth-child(4) { transition-delay: .6s; }
  .booked.show .bk-inner > :nth-child(5) { transition-delay: .75s; }
  .tick { width: 76px; height: 76px; margin: 0 auto; display: block; }
  .tick circle, .tick path { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .tick circle { stroke-dasharray: 176; stroke-dashoffset: 176; opacity: .7; transition: stroke-dashoffset 1.2s var(--ease) .25s; }
  .tick path { stroke-width: 3.5; stroke-dasharray: 36; stroke-dashoffset: 36; transition: stroke-dashoffset .8s var(--ease) 1s; }
  .booked.show .tick circle, .booked.show .tick path { stroke-dashoffset: 0; }
  .bk-title { margin-top: 18px; font-family: "Lora", Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.15; text-shadow: 0 2px 20px rgba(20, 60, 95, .2); }
  .bk-sub { margin-top: 6px; font-size: 15px; color: rgba(255,255,255,.9); }
  .bk-facts {
    list-style: none;
    margin-top: 26px;
    padding: 4px 16px;
    border-radius: 24px;
    text-align: left;
    color: var(--ink);
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .bk-facts li { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .bk-facts li:last-child { border-bottom: 0; }
  .bk-facts i { flex: none; font-size: 20px; color: var(--sea-deep); }
  .bk-facts .t { flex: 1; min-width: 0; }
  .bk-facts small { display: block; font-size: 12px; color: var(--ink-soft); }
  .bk-facts .mini { width: 34px; height: 34px; border-radius: 11px; font-size: 12px; }
  .bk-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 22px; }
  .bk-primary { height: 46px; padding: 0 24px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; color: var(--sea-deep); background: #fff; transition: transform .8s var(--ease); }
  .bk-primary:active { transform: scale(.97); transition-duration: .2s; }
  .bk-ghost { font-size: 14px; color: rgba(255,255,255,.92); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .intro { opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="glow" aria-hidden="true"></div>

  <div class="topbar intro">
    <a class="back" href="LISTENR.html" aria-label="Back to home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
  </div>

  <header class="head">
    <h1 class="serif intro" style="--d:1">Choose your timings!</h1>
    <p class="intro" style="--d:2">Select the time and date you want the call to be!<br>Take your time ;)</p>
  </header>

  <section class="card intro" style="--d:3" aria-label="Listeners">
    <p class="selected-line">You selected: <span class="roll" id="selName"></span></p>
    <div class="avatars" id="avatars"></div>
    <p class="listener-meta"><span id="selTag" class="roll"></span><span>·</span><span>Next free <span id="selNext" class="roll"></span></span></p>
  </section>

  <div class="month-nav intro" style="--d:4">
    <button id="prevM" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="month-label"><span class="roll" id="monthLabel"></span></div>
    <button id="nextM" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <section class="card cal intro" style="--d:5" aria-label="Calendar">
    <div class="weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="days-wrap">
      <div class="puck hidden instant" id="puck"></div>
      <div class="days" id="days"></div>
    </div>
    <p class="cal-empty" id="calEmpty"></p>
  </section>

  <section class="card time intro" style="--d:6" aria-label="Time">
    <div class="time-head">
      <div class="time-pill" id="timePill">–</div>
      <div class="seg" id="seg" data-mode="arc">
        <span class="thumb"></span>
        <button aria-pressed="true" data-mode="arc" aria-label="Dial view">
          <svg width="24" height="14" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 11c5-8 13-8 18 0"/></svg>
        </button>
        <button aria-pressed="false" data-mode="list" aria-label="List view">
          <svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 3h14M3 8h14M3 13h14"/></svg>
        </button>
      </div>
    </div>
    <div class="views">
      <div class="view arc" id="arc" tabindex="0" role="slider" aria-label="Start time" aria-valuemin="6" aria-valuemax="22">
        <svg id="arcSvg" aria-hidden="true">
          <rect id="arcWell" rx="14" fill="rgba(20, 40, 70, .045)"/>
          <path id="arcBase" fill="none" stroke="#dde2ea" stroke-width="4" stroke-linecap="round"/>
          <g id="arcAvail" fill="none" stroke="#bcd8ea" stroke-width="9" stroke-linecap="round"></g>
          <path id="arcSel" class="window" fill="none" stroke="var(--sea)" stroke-width="9" stroke-linecap="round"/>
          <circle id="arcDot" r="12" fill="var(--sea)" stroke="#fff" stroke-width="3"/>
        </svg>
        <div id="arcLabels"></div>
        <p class="hint" id="hint">Drag to choose · blue is free</p>
      </div>
      <div class="view list off" id="list" aria-label="Available start times"></div>
    </div>
  </section>

</div>

<section class="summary" aria-label="Call description" aria-live="polite">
  <span class="mini" id="dAv"></span>
  <span class="sum-txt">
    <span class="sum-name"><span class="roll" id="dName"></span></span>
    <span class="sum-rel"><span class="roll" id="dRel"></span></span>
    <span class="sum-when"><span class="roll" id="dDate"></span> · <span class="roll" id="dTime"></span></span>
  </span>
  <button class="cta" id="cta"><span class="roll" id="ctaText"><span>Confirm</span></span></button>
</section>

<section class="booked" id="booked" aria-live="polite" aria-labelledby="bkTitle" data-lenis-prevent hidden>
  <div class="bk-inner">
    <svg class="tick" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="28" />
      <path d="M21 33l7.5 7.5L44 25" />
    </svg>
    <h2 class="bk-title" id="bkTitle">You’re booked</h2>
    <p class="bk-sub" id="bkSub"></p>
    <ul class="bk-facts" id="bkFacts"></ul>
    <div class="bk-actions">
      <a class="bk-primary" id="bkGo" href="LISTENR-bookings.html">See my bookings</a>
      <button class="bk-ghost" id="bkCal"><span>Add to calendar</span></button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('keydown', e => { if (e.key === 'Tab') document.documentElement.classList.add('kbd'); });
  addEventListener('pointerdown', () => document.documentElement.classList.remove('kbd'));
  if (!reduceMotion && window.Lenis) {
    const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, smoothWheel: true });
    requestAnimationFrame(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); });
  }

  /* ---------- Data (made up for the prototype) ---------- */
  const LISTENERS = [
    ['Annanya Nair', 'Career · Stress', ['#f7a35c', '#d4542a']],
    ['Rohan Mehta', 'Relationships', ['#e9b48a', '#a85a3a']],
    ['Kavya Iyer', 'Loneliness', ['#f4b98c', '#c9643a']],
    ['Arjun Rao', 'Career · Pressure', ['#d9a27a', '#8f4a2e']],
    ['Meera Pillai', 'Family', ['#f6c08f', '#d86a34']],
    ['Ishaan Kapoor', 'Students', ['#e5a77b', '#9d532f']],
    ['Diya Sharma', 'Anything else', ['#f8b07a', '#e0602a']],
    ['Neel Desai', 'Burnout', ['#dcae8a', '#93523a']],
    ['Tara Menon', 'Grief', ['#f2bf98', '#c86b40']],
    ['Kabir Joshi', 'Relationships', ['#e0a172', '#a24d26']],
    ['Sana Qureshi', 'Loneliness', ['#f5b688', '#cf5d2c']],
    ['Vikram Bose', 'Career', ['#d8a684', '#8a4a30']],
  ];
  const initials = n => n.split(' ').map(w => w[0]).join('');
  const SESSION = 0.75; // 45 minutes
  const H_MIN = 6, H_MAX = 22;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const keyOf = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  function rand(seed) {
    let t = (seed + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  // Free windows [from, to] in hours for listener li on a date, or null if not free
  function windowsFor(li, d) {
    if (d <= today) return null;
    const s = li * 7919 + d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
    if (rand(s) > 0.42 + (li % 3) * 0.08) return null;
    const w = [], r = rand(s + 1);
    if (r < 0.75) { const a = 7 + Math.floor(rand(s + 2) * 5); w.push([a, a + 2 + Math.floor(rand(s + 3) * 3)]); }
    if (r > 0.35) { const a = 14 + Math.floor(rand(s + 4) * 4); w.push([a, Math.min(H_MAX, a + 2 + Math.floor(rand(s + 5) * 3))]); }
    return w;
  }
  function startsFor(win) {
    const out = [];
    (win || []).forEach(([a, b]) => { for (let t = a; t + SESSION <= b + 1e-9; t += 0.25) out.push(t); });
    return out;
  }
  function firstFreeDate(li, from) {
    const d = new Date(from);
    for (let i = 0; i < 120; i++, d.setDate(d.getDate() + 1)) if (windowsFor(li, d)) return new Date(d);
    return null;
  }

  /* ---------- Formatting ---------- */
  function hm(h) {
    const hh = Math.floor(h + 1e-6), mm = Math.round((h - hh) * 60);
    return { t: `${hh % 12 || 12}:${String(mm).padStart(2, '0')}`, ap: hh < 12 || hh === 24 ? 'am' : 'pm' };
  }
  const rangeHTML = h => { const a = hm(h), b = hm(h + SESSION); return `<b>${a.t}</b>&nbsp;${a.ap} – <b>${b.t}</b>&nbsp;${b.ap}`; };
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dateHTML = d => `${DAYS[d.getDay()]}, <b>${d.getDate()}</b> ${MONTHS[d.getMonth()].slice(0, 3)}`;
  const shortDate = d => `${DAYS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;

  // Run a cleanup when an animation ends, with a timer backstop:
  // throttled or hidden pages can pause animations and never fire onfinish
  function afterAnim(anim, ms, fn) {
    let done = false;
    const run = () => { if (!done) { done = true; fn(); } };
    anim.onfinish = run;
    setTimeout(run, ms + 60);
  }

  /* ---------- Roll: swap a value with a soft vertical blur and width glide ---------- */
  function roll(el, html, dir = 1) {
    const cur = el.lastElementChild;
    if (cur && cur.dataset.v === html) return;
    const next = document.createElement('span');
    next.innerHTML = html; next.dataset.v = html;
    if (!cur || reduceMotion) { el.replaceChildren(next); return; }
    const w0 = el.offsetWidth;
    el.appendChild(next);
    cur.style.position = 'absolute';
    const w1 = next.offsetWidth;
    cur.style.position = '';
    const opts = { duration: 900, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' };
    const w = el.animate({ width: [w0 + 'px', w1 + 'px'] }, opts);
    afterAnim(w, 900, () => w.cancel());
    afterAnim(cur.animate({ opacity: [1, 0], transform: ['none', `translateY(${-60 * dir}%)`], filter: ['blur(0)', 'blur(4px)'] }, { ...opts, duration: 600 }),
      600, () => cur.remove());
    const n = next.animate({ opacity: [0, 1], transform: [`translateY(${60 * dir}%)`, 'none'], filter: ['blur(4px)', 'blur(0)'] }, { ...opts, delay: 80 });
    afterAnim(n, 980, () => n.cancel());
  }

  /* ---------- State ---------- */
  const sel = { li: 0, date: null, time: null };
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  /* ---------- Listeners ---------- */
  const avWrap = document.getElementById('avatars');
  LISTENERS.forEach(([name, , [a, b]], i) => {
    const btn = document.createElement('button');
    btn.className = 'av';
    btn.textContent = initials(name);
    btn.setAttribute('aria-label', name);
    btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => chooseListener(i));
    avWrap.appendChild(btn);
  });

  function chooseListener(i, first) {
    sel.li = i;
    [...avWrap.children].forEach((b, n) => b.setAttribute('aria-pressed', n === i));    const [name, tag, [a, b]] = LISTENERS[i];
    roll(document.getElementById('selName'), name);
    roll(document.getElementById('selTag'), tag);
    const next = firstFreeDate(i, new Date(today.getTime() + 864e5));
    roll(document.getElementById('selNext'), next ? shortDate(next) : '—');

    // Keep the chosen date if this listener is free then, otherwise move to their next free day
    if (!sel.date || !windowsFor(i, sel.date)) {
      const inView = firstFreeDate(i, new Date(Math.max(view, today.getTime() + 864e5)));
      sel.date = inView || next;
    }
    if (sel.date && (sel.date.getMonth() !== view.getMonth() || sel.date.getFullYear() !== view.getFullYear())) {
      changeMonth(new Date(sel.date.getFullYear(), sel.date.getMonth(), 1));
    } else {
      paintDays();
    }
    chooseTime(sel.time, true);

    document.getElementById('dAv').textContent = initials(name);
    if (!first) resetCta();
  }

  /* ---------- Calendar ---------- */
  const daysEl = document.getElementById('days');
  const puck = document.getElementById('puck');
  const calEmpty = document.getElementById('calEmpty');

  function buildDays() {
    const y = view.getFullYear(), m = view.getMonth();
    const lead = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
    daysEl.replaceChildren();
    for (let i = 0; i < lead; i++) daysEl.appendChild(document.createElement('span'));
    for (let d = 1; d <= count; d++) {
      const b = document.createElement('button');
      const date = new Date(y, m, d);
      b.className = 'day';
      b.textContent = d;
      b.dataset.key = keyOf(date);
      b._date = date;
      if (+date === +today) b.classList.add('today');
      b.addEventListener('click', () => { if (b.classList.contains('avail')) chooseDate(date); });
      daysEl.appendChild(b);
    }
    roll(document.getElementById('monthLabel'), `${MONTHS[m]} ${y}`, buildDays.dir || 1);
  }
  function paintDays() {
    let any = false;
    daysEl.querySelectorAll('.day').forEach(b => {
      const free = !!windowsFor(sel.li, b._date);
      any ||= free;
      b.classList.toggle('avail', free);
      b.disabled = !free;
      b.classList.toggle('sel', !!sel.date && b.dataset.key === keyOf(sel.date));
      b.setAttribute('aria-label', `${shortDate(b._date)}${free ? ', free' : ', not free'}`);
    });
    calEmpty.textContent = any ? '' : `${LISTENERS[sel.li][0].split(' ')[0]} has no free days this month`;
    placePuck();
  }
  function placePuck() {
    const cell = sel.date && daysEl.querySelector(`[data-key="${keyOf(sel.date)}"]`);
    if (!cell) { puck.classList.add('hidden'); return; }
    const wasHidden = puck.classList.contains('hidden');
    if (wasHidden) puck.classList.add('instant');
    puck.style.transform = `translate(${cell.offsetLeft + cell.offsetWidth / 2 - 25}px, ${cell.offsetTop + cell.offsetHeight / 2 - 25}px)${wasHidden ? ' scale(.6)' : ''}`;
    if (wasHidden) {
      puck.offsetWidth;
      puck.classList.remove('instant', 'hidden');
      puck.style.transform = puck.style.transform.replace(' scale(.6)', '');
    }
  }
  let monthBusy = false;
  function changeMonth(to) {
    if (monthBusy) return;
    const dir = to > view ? 1 : -1;
    monthBusy = true;
    puck.classList.add('hidden');
    const out = reduceMotion ? null : daysEl.animate(
      { opacity: [1, 0], transform: ['none', `translateX(${-24 * dir}px)`], filter: ['blur(0)', 'blur(6px)'] },
      { duration: 320, easing: 'cubic-bezier(.45, 0, .2, 1)', fill: 'forwards' });
    const swap = () => {
      view = to; buildDays.dir = dir; buildDays(); paintDays();
      out?.cancel();
      if (!reduceMotion) daysEl.animate(
        { opacity: [0, 1], transform: [`translateX(${24 * dir}px)`, 'none'], filter: ['blur(6px)', 'blur(0)'] },
        { duration: 900, easing: 'cubic-bezier(.16, 1, .3, 1)' });
      monthBusy = false;
    };
    out ? afterAnim(out, 320, swap) : swap();
  }
  document.getElementById('prevM').addEventListener('click', () => {
    const to = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    if (to >= new Date(today.getFullYear(), today.getMonth(), 1)) changeMonth(to);
  });
  document.getElementById('nextM').addEventListener('click', () => changeMonth(new Date(view.getFullYear(), view.getMonth() + 1, 1)));

  function chooseDate(date) {
    sel.date = date;
    paintDays();
    chooseTime(sel.time, true);
    resetCta();
  }

  /* ---------- Time ---------- */
  const arc = document.getElementById('arc');
  const labelsEl = document.getElementById('arcLabels');
  const pill = document.getElementById('timePill');
  const listEl = document.getElementById('list');
  const S = 68;          // px per hour along the dial
  const K = 0.00042;     // how much the dial curves
  let W = 0, CX = 0, BASE = 128;
  let pos = 9, target = 9, vel = 0, dragging = false, settled = false;
  let starts = [];

  const labels = [];
  for (let h = H_MIN; h <= H_MAX; h++) {
    const el = document.createElement('div');
    el.className = 'lbl';
    el.innerHTML = `${h % 12 || 12}<small>${h < 12 ? 'am' : 'pm'}</small>`;
    labelsEl.appendChild(el);
    labels.push([h, el]);
  }

  const curveY = x => BASE + K * (x - CX) * (x - CX);
  const xOf = h => CX + (h - pos) * S;
  function pathBetween(x0, x1) {
    x0 = Math.max(x0, -40); x1 = Math.min(x1, W + 40);
    if (x1 <= x0) return '';
    let d = `M${x0.toFixed(1)} ${curveY(x0).toFixed(1)}`;
    for (let x = x0 + 6; x < x1; x += 6) d += `L${x.toFixed(1)} ${curveY(x).toFixed(1)}`;
    return d + `L${x1.toFixed(1)} ${curveY(x1).toFixed(1)}`;
  }

  function measure() {
    W = arc.clientWidth; CX = W / 2;
    const well = document.getElementById('arcWell');
    well.setAttribute('x', CX - 32); well.setAttribute('y', BASE - 92); well.setAttribute('width', 64); well.setAttribute('height', 118);
    document.getElementById('arcDot').setAttribute('cx', CX);
    document.getElementById('arcDot').setAttribute('cy', BASE);
    document.getElementById('arcBase').setAttribute('d', pathBetween(-40, W + 40));
  }

  const availG = document.getElementById('arcAvail');
  const selPath = document.getElementById('arcSel');
  function windows() { return sel.date ? windowsFor(sel.li, sel.date) || [] : []; }
  function drawAvail() {
    availG.replaceChildren(...windows().map(([a, b]) => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.dataset.a = a; p.dataset.b = b;
      return p;
    }));
    const win = windows();
    labels.forEach(([h, el]) => el.classList.toggle('on', win.some(([a, b]) => h >= a && h <= b)));
  }

  let lastPill = '';
  function render() {
    availG.childNodes.forEach(p => p.setAttribute('d', pathBetween(xOf(+p.dataset.a), xOf(+p.dataset.b))));
    const valid = starts.some(s => Math.abs(s - pos) < 0.13);
    selPath.setAttribute('d', starts.length ? pathBetween(CX, xOf(pos + SESSION)) : '');
    selPath.style.opacity = valid ? 1 : 0.35;
    labels.forEach(([h, el]) => {
      const x = xOf(h), dx = Math.abs(x - CX);
      const o = Math.max(0, 1 - dx / (W * 0.72));
      el.style.transform = `translate3d(${x.toFixed(1)}px, ${(curveY(x) - 66).toFixed(1)}px, 0) scale(${(0.82 + 0.18 * o).toFixed(3)})`;
      el.style.opacity = o.toFixed(3);
    });
    const q = Math.round(pos * 4) / 4;
    const html = starts.length ? rangeHTML(q) : 'No date chosen';
    if (html !== lastPill) { pill.innerHTML = `<span>${html}</span>`; lastPill = html; }
    pill.classList.toggle('muted', !valid);
  }

  function nearest(h) {
    if (!starts.length) return h;
    return starts.reduce((best, s) => Math.abs(s - h) < Math.abs(best - h) ? s : best, starts[0]);
  }
  function snapTo(t) { target = t; settled = false; commit(t); }

  // Spring-free glide: exponential approach feels like butter and never overshoots
  let lastT = performance.now();
  function tick(now) {
    const dt = Math.min(48, now - lastT); lastT = now;
    if (!dragging && !settled) {
      const k = reduceMotion ? 1 : 1 - Math.exp(-dt / 150);
      pos += (target - pos) * k;
      if (Math.abs(target - pos) < 0.0008) { pos = target; settled = true; }
      render();
    }
    requestAnimationFrame(tick);
  }

  let startX = 0, lastX = 0, lastMoveT = 0, moved = false;
  arc.addEventListener('pointerdown', e => {
    dragging = true; moved = false; vel = 0;
    startX = lastX = e.clientX; lastMoveT = performance.now();
    arc.classList.add('dragging');
    arc.setPointerCapture(e.pointerId);
    hint.style.opacity = 0;
  });
  arc.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now(), dx = e.clientX - lastX;
    if (Math.abs(e.clientX - startX) > 4) moved = true;
    let step = -dx / S;
    if (pos < H_MIN || pos > H_MAX - SESSION) step *= 0.35; // soft edges
    pos += step;
    vel = 0.75 * (step / Math.max(1, now - lastMoveT)) + 0.25 * vel;
    lastX = e.clientX; lastMoveT = now;
    render();
  });
  const release = e => {
    if (!dragging) return;
    dragging = false;
    arc.classList.remove('dragging');
    if (!moved) { // a tap: jump to the hour under the finger
      const x = e.clientX - arc.getBoundingClientRect().left;
      snapTo(nearest(Math.round(pos + (x - CX) / S)));
    } else {
      const fling = performance.now() - lastMoveT > 80 ? 0 : vel * 260; // carry momentum into the snap
      snapTo(nearest(pos + fling));
    }
    resetCta();
  };
  arc.addEventListener('pointerup', release);
  arc.addEventListener('pointercancel', release);
  let wheelTimer;
  arc.addEventListener('wheel', e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    target = pos = pos + e.deltaX / S * 0.6;
    settled = false;
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => snapTo(nearest(pos)), 140);
  }, { passive: false });
  arc.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key) || !starts.length) return;
    e.preventDefault();
    const i = starts.indexOf(sel.time) + (e.key === 'ArrowRight' ? 1 : -1);
    snapTo(starts[Math.max(0, Math.min(starts.length - 1, i))]);
  });
  const hint = document.getElementById('hint');

  function chooseTime(t, keepIfValid) {
    starts = startsFor(windows());
    drawAvail();
    buildList();
    if (!starts.length) { sel.time = null; settled = false; commit(null); return; }
    const next = keepIfValid && starts.includes(t) ? t : (t == null ? starts[0] : nearest(t));
    snapTo(next);
  }

  // Push the chosen values to the call summary and list
  function commit(t) {
    sel.time = t;
    arc.setAttribute('aria-valuenow', t ?? '');
    arc.setAttribute('aria-valuetext', t == null ? 'No time' : `${hm(t).t} ${hm(t).ap}`);
    listEl.querySelectorAll('.slot').forEach(b => b.setAttribute('aria-pressed', +b.dataset.t === t));
    updateDock();
  }

  /* ---------- List view ---------- */
  function buildList() {
    const half = starts.filter(s => Number.isInteger(s * 2));
    if (!half.length) {
      listEl.innerHTML = `<p class="list-empty">Pick a highlighted date to see times</p>`;
      return;
    }
    listEl.replaceChildren(...half.map(s => {
      const b = document.createElement('button');
      b.className = 'slot';
      b.dataset.t = s;
      b.innerHTML = `${hm(s).t} <small>${hm(s).ap}</small>`;
      b.setAttribute('aria-pressed', s === sel.time);
      b.addEventListener('click', () => { snapTo(s); resetCta(); });
      return b;
    }));
  }
  const seg = document.getElementById('seg');
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const mode = b.dataset.mode;
    seg.dataset.mode = mode;
    seg.querySelectorAll('button').forEach(o => o.setAttribute('aria-pressed', o === b));
    arc.classList.toggle('off', mode !== 'arc');
    listEl.classList.toggle('off', mode !== 'list');
    if (mode === 'arc') { measure(); render(); }
  }));

  /* ---------- Call summary ---------- */
  // "Day after tomorrow morning", "This evening", "Next Monday afternoon"…
  function relPhrase(date, h) {
    const days = Math.round((new Date(date).setHours(0, 0, 0, 0) - today) / 864e5);
    const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
    if (days === 0) return part === 'night' ? 'Tonight' : `This ${part}`;
    const day = days === 1 ? 'Tomorrow' : days === 2 ? 'Day after tomorrow'
      : days < 7 ? `This ${DAYS[date.getDay()]}` : days < 14 ? `Next ${DAYS[date.getDay()]}` : `In ${Math.round(days / 7)} weeks`;
    return `${day} ${part}`;
  }
  let prevDate = null;
  function updateDock() {
    roll(document.getElementById('dName'), LISTENERS[sel.li][0]);
    roll(document.getElementById('dRel'), sel.date && sel.time != null ? relPhrase(sel.date, sel.time) : 'Pick a day and time');
    const dir = prevDate && sel.date && sel.date < prevDate ? -1 : 1;
    roll(document.getElementById('dDate'), sel.date ? `${sel.date.getDate()} ${MONTHS[sel.date.getMonth()].slice(0, 3)}` : 'Pick a date', dir);
    prevDate = sel.date;
    roll(document.getElementById('dTime'), sel.time == null ? '—' : `<b>${hm(sel.time).t}–${hm(sel.time + SESSION).t}</b> ${hm(sel.time + SESSION).ap}`);
  }
  const cta = document.getElementById('cta');
  function resetCta() {
    if (!cta.classList.contains('done')) return;
    cta.classList.remove('done');
    roll(document.getElementById('ctaText'), 'Confirm', -1);
  }
  cta.addEventListener('click', () => {
    if (sel.time == null || cta.classList.contains('done')) return;
    cta.classList.add('done');
    roll(document.getElementById('ctaText'), 'Booked ✓');
    setTimeout(showBooked, reduceMotion ? 0 : 500);
  });

  /* ---------- Booked ---------- */
  function showBooked() {
    const [name, tag] = LISTENERS[sel.li];
    const first = name.split(' ')[0];
    const at = new Date(sel.date); at.setHours(Math.floor(sel.time), Math.round((sel.time % 1) * 60), 0, 0);
    let mode = 'voice';
    try { mode = JSON.parse(localStorage.getItem('listenr-settings') || '{}').callType || 'voice'; } catch {}
    const id = `LSN-${2600 + Math.floor(Math.random() * 400)}`;

    // Hand the booking to the Bookings screen
    try {
      const list = JSON.parse(localStorage.getItem('listenr-booked') || '[]');
      list.push({ id, who: name, at: at.toISOString(), mode });
      localStorage.setItem('listenr-booked', JSON.stringify(list));
    } catch {}

    const a = hm(sel.time), b = hm(sel.time + SESSION);
    const rel = relPhrase(sel.date, sel.time);
    document.getElementById('bkSub').textContent = `${first} will be there for you ${rel.charAt(0).toLowerCase() + rel.slice(1)}.`;
    document.getElementById('bkFacts').innerHTML = `
      <li><span class="mini">${initials(name)}</span><span class="t">${name}<small>${tag}</small></span></li>
      <li><i class="ph ph-calendar-check"></i><span class="t">${rel}<small>${DAYS[at.getDay()]}, ${at.getDate()} ${MONTHS[at.getMonth()]}</small></span></li>
      <li><i class="ph ph-clock"></i><span class="t">${a.t} ${a.ap} – ${b.t} ${b.ap}<small>45 minutes</small></span></li>
      <li><i class="ph ph-${mode === 'video' ? 'video-camera' : 'phone'}"></i><span class="t">${mode === 'video' ? 'Video call' : 'Voice call'}<small>Join from the app, no number shared</small></span></li>
      <li><i class="ph ph-bell-ringing"></i><span class="t">Reminder 30 minutes before<small>Booking ${id}</small></span></li>`;
    document.getElementById('bkGo').href = `LISTENR-bookings.html?new=${id}`;

    const el = document.getElementById('booked');
    el.hidden = false;
    el.offsetWidth;
    el.classList.add('show');
  }
  document.getElementById('bkCal').addEventListener('click', e => {
    e.currentTarget.querySelector('span').textContent = 'Added to calendar ✓';
  });

  /* ---------- Boot ---------- */
  buildDays();
  measure();
  // Open with the listener chosen on the Listeners screen, if any
  const wanted = new URLSearchParams(location.search).get("listener");
  const wantedI = LISTENERS.findIndex(([n]) => n === wanted);
  chooseListener(wantedI >= 0 ? wantedI : 6, true);
  pos = target;
  render();
  requestAnimationFrame(tick);
  new ResizeObserver(() => { measure(); render(); placePuck(); }).observe(arc);
  // Fonts change label widths; re-place once they land
  document.fonts?.ready.then(() => { measure(); render(); placePuck(); });
</script>
</body>
</html>
