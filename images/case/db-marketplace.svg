anchor="start">“Chest X-rays, research use”</text><text x="868" y="492" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#1a8d4f" text-anchor="start">2 matching datasets</text><text x="60" y="560" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start">Listings go live only after every gate passes. Each decision is logged with a reason code.</text></svg>