 Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">PRICING</text><text x="832" y="426" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Premium, irreversible</text><line x1="832" y1="438" x2="1116" y2="438" stroke="#e4e2dd" stroke-width="1.5"/><text x="832" y="454" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">DERIVATIVE MODEL</text><text x="832" y="476" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Buyer owns, public licence</text><line x1="832" y1="488" x2="1116" y2="488" stroke="#e4e2dd" stroke-width="1.5"/><text x="832" y="504" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">SUPPLIER MAY AUDIT</text><text x="832" y="526" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Pre-release review</text></svg>