<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0047FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1200" height="600" rx="0" fill="#f5f5f3"/><text x="60" y="70" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0047FF" text-anchor="start" letter-spacing="1.2">THREE TIERS, THREE SETS OF RIGHTS</text><text x="60" y="110" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#111111" text-anchor="start">Price follows use class first, consumption second</text><rect x="60" y="150" width="340" height="410" rx="20" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><rect x="88" y="150" width="60" height="6" rx="3" fill="#1a8d4f"/><text x="88" y="198" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a8d4f" text-anchor="start" letter-spacing="1.5">TIER 1</text><text x="88" y="232" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#111111" text-anchor="start">Internal evaluation</text><text x="88" y="262" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">RAG evals and internal benchmarks.</text><text x="88" y="283" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">No training, no redistribution.</text><line x1="88" y1="338" x2="372" y2="338" stroke="#e4e2dd" stroke-width="1.5"/><text x="88" y="354" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">BILLING UNIT</text><text x="88" y="376" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Per row touched, per run</text><line x1="88" y1="388" x2="372" y2="388" stroke="#e4e2dd" stroke-width="1.5"/><text x="88" y="404" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">PRICING</text><text x="88" y="426" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Low rate, monthly cap</text><line x1="88" y1="438" x2="372" y2="438" stroke="#e4e2dd" stroke-width="1.5"/><text x="88" y="454" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">DERIVATIVE MODEL</text><text x="88" y="476" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">No model trained</text><line x1="88" y1="488" x2="372" y2="488" stroke="#e4e2dd" stroke-width="1.5"/><text x="88" y="504" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">SUPPLIER MAY AUDIT</text><text x="88" y="526" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">N/A</text><rect x="432" y="150" width="340" height="410" rx="20" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><rect x="460" y="150" width="60" height="6" rx="3" fill="#0047FF"/><text x="460" y="198" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0047FF" text-anchor="start" letter-spacing="1.5">TIER 2</text><text x="460" y="232" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#111111" text-anchor="start">Commercial training</text><text x="460" y="262" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">Pretraining, fine-tuning, RLHF,</text><text x="460" y="283" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">derivative models for sale.</text><line x1="460" y1="338" x2="744" y2="338" stroke="#e4e2dd" stroke-width="1.5"/><text x="460" y="354" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">BILLING UNIT</text><text x="460" y="376" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Tokens or rows + rights fee</text><line x1="460" y1="388" x2="744" y2="388" stroke="#e4e2dd" stroke-width="1.5"/><text x="460" y="404" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">PRICING</text><text x="460" y="426" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Higher rate, volume tiers</text><line x1="460" y1="438" x2="744" y2="438" stroke="#e4e2dd" stroke-width="1.5"/><text x="460" y="454" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.2">DERIVATIVE MODEL</text><text x="460" y="476" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#111111" text-anchor="start">Buyer owns the model</