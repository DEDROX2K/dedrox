<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0047FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1200" height="580" rx="0" fill="#f5f5f3"/><text x="60" y="70" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0047FF" text-anchor="start" letter-spacing="1.2">FLAT LICENCE VS. METERED USE</text><text x="60" y="110" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#111111" text-anchor="start">The same 5% slice, priced two ways</text><rect x="60" y="150" width="520" height="380" rx="20" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><text x="92" y="196" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.5">FLAT, WHOLE CORPUS</text><text x="92" y="262" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="64" font-weight="500" fill="#111111" text-anchor="start">$6,000</text><text x="92" y="296" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#4b4b4b" text-anchor="start">one price, one buyer, paid up-front</text><rect x="92" y="340" width="456" height="26" rx="6" fill="#d9d7d0"/><text x="92" y="392" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">Pays for 2,000,000 rows</text><rect x="92" y="420" width="456" height="26" rx="6" fill="#f5f5f3"/><rect x="92" y="420" width="23" height="26" rx="6" fill="#0047FF"/><text x="92" y="472" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#4b4b4b" text-anchor="start">Actually uses 100,000 rows (5%)</text><text x="92" y="508" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#c8372d" text-anchor="start">95% of the spend buys data never touched</text><rect x="620" y="150" width="520" height="380" rx="20" fill="#0047FF"/><text x="652" y="196" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#cfe0ff" text-anchor="start" letter-spacing="1.5">METERED, PER RUN</text><text x="652" y="262" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="64" font-weight="500" fill="#fff" text-anchor="start">$50</text><text x="790" y="262" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#cfe0ff" text-anchor="start">/ run</text><text x="652" y="296" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#dfe9ff" text-anchor="start">100,000 rows × $0.0005</text><rect x="652" y="322" width="456" height="34" rx="8" fill="#3a6dff"/><rect x="652" y="322" width="364" height="34" rx="8" fill="#fff"/><text x="670" y="345" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0047FF" text-anchor="start">Supplier $40</text><text x="1096" y="345" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="end">Platform $10</text><text x="652" y="400" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cfe0ff" text-anchor="start">Run 1</text><rect x="720" y="384" width="100" height="22" rx="6" fill="#fff"/><text x="832" y="400" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start">$50 total</text><text x="652" y="438" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cfe0ff" text-anchor="start">Run 2</text><rect x="720" y="422" width="200" height="22" rx="6" fill="#fff"/><text x="932" y="438" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start">$100 total</text><text x="652" y="476" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#cfe0ff" text-anchor="start">Run 3</text><rect x="720" y="460" width="300" height="22" rx="6" fill="#fff"/><text x="1032" y="476" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#fff" text-anchor="start">$150 total</text><text x="652" y="512" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="start">Metered pays the supplier more only after ~150 runs per listing</text></svg>