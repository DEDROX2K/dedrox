<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0047FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1200" height="540" rx="0" fill="#f5f5f3"/><text x="60" y="70" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0047FF" text-anchor="start" letter-spacing="1.2">TRAIN WITHOUT DOWNLOAD</text><text x="60" y="110" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#111111" text-anchor="start">Only permitted outputs cross the boundary</text><rect x="60" y="170" width="230" height="300" rx="18" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><text x="88" y="208" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.5">BUYER</text><rect x="88" y="232" width="174" height="80" rx="12" fill="#f5f5f3"/><text x="175" y="266" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">Signed training</text><text x="175" y="288" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#111111" text-anchor="middle">container</text><rect x="100" y="328" width="140.4" height="26" rx="13" fill="#eaf1ff"/><text x="170.2" y="346" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#002E9E" text-anchor="middle">Allowlist review</text><text x="88" y="424" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4b4b4b" text-anchor="start">Sees metrics and</text><tex