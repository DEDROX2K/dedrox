 y1="260" x2="610" y2="260" stroke="#0047FF" stroke-width="2" marker-end="url(#ah)"/><rect x="388" y="326" width="190" height="80" rx="14" fill="#eaf1ff"/><text x="483" y="356" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#002E9E" text-anchor="middle">KMS releases key</text><text x="483" y="378" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#002E9E" text-anchor="middle">only on matching</text><text x="483" y="394" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#002E9E" text-anchor="middle">attestation</text><line x1="578" y1="366" x2="630" y2="366" stroke="#0047FF" stroke-width="1.5" stroke-dasharray="4 4"/><text x="754" y="440" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#4b4b4b" text-anchor="middle">Attestation proves the exact image hash</text><line x1="896" y1="300" x2="958" y2="300" stroke="#0047FF" stroke-width="2"/><rect x="958" y="170" width="8" height="300" rx="4" fill="#111111"/><text x="962" y="152" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="1.5">EGRESS GATE</text><line x1="966" y1="212" x2="1000" y2="212" stroke="#1a8d4f" stroke-width="2"/><rect x="1000" y="186" width="140" height="52" rx="12" fill="#e3f4ea"/><text x="1070" y="217" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a8d4f" text-anchor="middle">Model checkpoint</text><line x1="966" y1="282" x2="1000" y2="282" stroke="#1a8d4f" stroke-width="2"/><rect x="1000" y="256" width="140" height="52" rx="12" fill="#e3f4ea"/><text x="1070" y="287" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a8d4f" text-anchor="middle"