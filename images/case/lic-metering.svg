<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0047FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1200" height="560" rx="0" fill="#f5f5f3"/><text x="60" y="70" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0047FF" text-anchor="start" letter-spacing="1.2">METERING PIPELINE</text><text x="60" y="110" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="30" font-weight="500" fill="#111111" text-anchor="start">Proven use, without exposing the data</text><rect x="60" y="160" width="258" height="168" rx="16" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><circle cx="94" cy="196" r="15" fill="#0047FF"/><text x="94" y="202" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="122" y="203" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">Grant</text><text x="84" y="240" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Dataset ID, version hash, use</text><text x="84" y="261" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">class, row scope, expiry, price</text><text x="84" y="282" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">terms. Signed.</text><line x1="318" y1="244" x2="340" y2="244" stroke="#0047FF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="342" y="160" width="258" height="168" rx="16" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><circle cx="376" cy="196" r="15" fill="#0047FF"/><text x="376" y="202" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="404" y="203" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">Event</text><text x="366" y="240" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Every billable action: grant</text><text x="366" y="261" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">ID, rows or tokens, time, hash</text><text x="366" y="282" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">of the previous event.</text><line x1="600" y1="244" x2="622" y2="244" stroke="#0047FF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="624" y="160" width="258" height="168" rx="16" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><circle cx="658" cy="196" r="15" fill="#0047FF"/><text x="658" y="202" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="686" y="203" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">Commitment</text><text x="648" y="240" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Merkle root of the chain</text><text x="648" y="261" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">published at intervals.</text><text x="648" y="282" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Suppliers check their own</text><text x="648" y="303" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">events.</text><line x1="882" y1="244" x2="904" y2="244" stroke="#0047FF" stroke-width="1.8" marker-end="url(#ah)"/><rect x="906" y="160" width="258" height="168" rx="16" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><circle cx="940" cy="196" r="15" fill="#0047FF"/><text x="940" y="202" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="968" y="203" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">Reconciliation</text><text x="930" y="240" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Buyer gets a statement mapping</text><text x="930" y="261" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">events to billed units.</text><text x="930" y="282" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#4b4b4b" text-anchor="start">Disputes cite hashes.</text><text x="60" y="392" font-family="'Google Sans','Product Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#828282" text-anchor="start" letter-spacing="1.5">APPEND-ONLY EVENT CHAIN</text><rect x="60" y="410" width="128" height="92" rx="12" fill="#ffffff" stroke="#e4e2dd" stroke-width="1.5"/><text x="76" y="438" font-family="'Google Sans','Product Sans',Helvetica,A