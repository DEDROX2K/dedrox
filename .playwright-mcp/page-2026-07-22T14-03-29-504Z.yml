          - paragraph [ref=e91]:
            - text: Hi, I’m Raghav. I’m currently a
            - strong [ref=e92]: Product Development Assistant
            - text: at Aircards, working directly with the Head of Product. As an immigrant, this role has been incredibly eye-opening—it’s given me a front-row seat to corporate management and the real ins and outs of how products are actually shipped. My day-to-day involves blending AI workflows with UX design, which ties perfectly into my background. I originally came to the UK to get my Master's in Birmingham, but I eventually made beautiful Newcastle my second home. Since arriving, I’ve ventured into a few different spaces to find exactly where I thrive. I’ve been a 3D designer for a gaming company partnered with Facebook, a Principal Product Designer at OpenDataBay, and I’ve tackled over 50 freelance projects before landing at Aircards. Right now, I am keeping my eyes wide open for *sponsored opportunities*, anywhere in the world. I’m excited to see where my next journey takes me. If my background resonates with your team, I’d love to connect. Best, Raghav Prasanna
