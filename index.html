<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedrox | Links</title>
    <meta name="description" content="Dedrox links and destinations for Raghav Prasanna.">
    <meta property="og:title" content="Dedrox | Links">
    <meta property="og:description" content="A stripped-back Dedrox landing page with direct links.">
    <meta property="og:image" content="images/id-peek-card.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Dedrox | Links">
    <meta name="twitter:description" content="A stripped-back Dedrox landing page with direct links.">
    <meta name="twitter:image" content="images/id-peek-card.png">
    <link rel="icon" href="logo.png" type="image/png">
    <meta name="theme-color" content="#ff3f3f">
    <link rel="stylesheet" href="prototype.css">
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top, rgba(255, 99, 71, 0.08), transparent 26%),
                linear-gradient(180deg, #f4f1ea 0%, #ebe7df 46%, #e3ddd1 100%);
            color: #171717;
            overflow: hidden;
        }

        .status-notch-wrapper,
        .pill-radiating-glow,
        .pill-particle-field,
        .expand-shockwave,
        .contract-shockwave,
        .theme-bloom,
        .page-transition-overlay,
        .nav-overlay,
        .device-edge-handles,
        .content-mask {
            display: none !important;
        }

        .device-container {
            box-shadow:
                0 36px 90px rgba(30, 22, 10, 0.12),
                0 10px 28px rgba(30, 22, 10, 0.08);
        }

        .site-content {
            padding: calc(var(--pill-container-h) + 24px) clamp(16px, 3vw, 32px) 32px;
        }

        .links-shell {
            width: min(100%, 900px);
            margin: 0 auto;
            padding: clamp(22px, 3vw, 34px);
            border-radius: 34px;
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.82),
                0 20px 50px rgba(41, 33, 18, 0.08);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
        }

        .links-intro {
            display: grid;
            gap: 10px;
            margin-bottom: 28px;
        }

        .links-kicker {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(23, 23, 23, 0.56);
        }

        .links-title {
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 5.6rem);
            line-height: 0.9;
            letter-spacing: -0.08em;
            text-transform: lowercase;
        }

        .links-copy {
            max-width: 42rem;
            margin: 0;
            font-size: clamp(1rem, 1.7vw, 1.18rem);
            line-height: 1.35;
            color: rgba(23, 23, 23, 0.72);
        }

        .links-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        .links-list li {
            margin: 0;
        }

        .link-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border-radius: 22px;
            border: 1px solid rgba(23, 23, 23, 0.09);
            background: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            color: inherit;
            transition:
                transform 180ms ease,
                border-color 180ms ease,
                background-color 180ms ease,
                box-shadow 180ms ease;
        }

        .link-row:hover,
        .link-row:focus-visible {
            transform: translateY(-2px);
            border-color: rgba(23, 23, 23, 0.18);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 12px 26px rgba(30, 22, 10, 0.08);
            outline: none;
        }

        .link-text {
            display: grid;
            gap: 4px;
            min-width: 0;
        }

        .link-label {
            font-size: clamp(1rem, 1.4vw, 1.2rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .link-meta {
            font-size: 0.9rem;
            color: rgba(23, 23, 23, 0.58);
            overflow-wrap: anywhere;
        }

        .link-arrow {
            font-size: 1.1rem;
            color: rgba(23, 23, 23, 0.46);
        }

        @media (max-width: 640px) {
            .site-content {
                padding: calc(var(--pill-container-h) + 16px) 14px 22px;
            }

            .links-shell {
                padding: 18px;
                border-radius: 26px;
            }

            .link-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .link-arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div>
        <button class="site-name" onclick="window.location.href='LISTENR.html'">Dedrox</button>
    </div>
</body>
</html>
